<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember Mesa · smoke-opus</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a2350; overflow: hidden; font-family: ui-rounded, 'Nunito', ui-sans-serif, system-ui, sans-serif; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 16px; left: 16px; z-index: 2; color: #fff7ec;
        padding: 10px 16px 12px; border-radius: 16px;
        background: linear-gradient(160deg, rgba(60,30,80,0.55), rgba(120,50,60,0.4));
        backdrop-filter: blur(8px); border: 1px solid rgba(255,220,180,0.3);
        text-shadow: 0 1px 2px rgba(0,0,0,0.45); font-size: 14px; line-height: 1.35;
        box-shadow: 0 6px 24px rgba(30,10,40,0.35);
      }
      #title { font-weight: 800; letter-spacing: 0.04em; font-size: 15px; }
      #gems { display: flex; gap: 6px; margin: 6px 0 4px; }
      .gem { width: 14px; height: 14px; transform: rotate(45deg); border-radius: 3px; opacity: 0.25; border: 1px solid rgba(255,255,255,0.6); }
      .gem.got { opacity: 1; box-shadow: 0 0 10px currentColor; }
      #status { font-size: 12px; opacity: 0.9; }
      #hint { opacity: 0.7; font-size: 11px; margin-top: 4px; }
      #banner {
        position: fixed; inset: 0; display: none; place-items: center; z-index: 3; pointer-events: none;
        color: #fff4e0; font-size: 44px; font-weight: 900; letter-spacing: 0.06em;
        text-shadow: 0 0 24px rgba(255,170,90,0.9), 0 3px 0 rgba(90,30,40,0.6);
      }
      #banner small { display: block; font-size: 16px; font-weight: 600; text-align: center; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="title">EMBER MESA</div>
      <div id="gems"></div>
      <div id="status">Loading…</div>
      <div id="hint">WASD move · Space jump (hold = glide) · Shift dash · Q/E camera</div>
    </div>
    <div id="banner"><div>MESA RELIT!<small id="bannerSub"></small></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
