<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fox Spirit — Autumn Awakening</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
      #hud {
        position: fixed; top: 14px; left: 14px; z-index: 2; color: #f5f5f5;
        padding: 10px 14px; border-radius: 12px; background: rgba(0,0,0,0.5);
        backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2);
        font-size: 14px; line-height: 1.45; max-width: 360px;
      }
      #hint { opacity: 0.8; font-size: 12px; margin-top: 4px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="status">Loading fox spirit…</div>
      <div id="hint">WASD move · Space jump (hold=glide) · Shift dash · Reach the shrine to restore color</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
