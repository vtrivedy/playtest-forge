<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creature Island · playtest-forge</title>
    <style>
      html, body { margin: 0; height: 100%; background: #6ec8ff; overflow: hidden; font-family: ui-rounded, ui-sans-serif, system-ui, sans-serif; }
      #hud {
        position: fixed; top: 14px; left: 14px; z-index: 2; color: #fff;
        padding: 10px 14px; border-radius: 12px; background: rgba(20,40,70,0.45);
        backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.25);
        text-shadow: 0 1px 2px rgba(0,0,0,0.5); font-size: 14px; line-height: 1.4;
      }
      #hint { opacity: 0.85; font-size: 12px; margin-top: 4px; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="status">Loading…</div>
      <div id="hint">WASD move · Space jump · Shift dash · Hold Space in air = glide</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
